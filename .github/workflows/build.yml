name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install SDK components
      run: |
        sdkmanager --install "platforms;android-37" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.22.1"
        yes | sdkmanager --licenses || true

    - name: Create server.properties
      run: cp server.properties.example server.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew :manager:assembleRelease

    - name: Find APK
      id: find-apk
      run: |
        APK_PATH=$(find . -name "*.apk" -path "*/release/*" | head -1)
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
        echo "Found APK: $APK_PATH"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: yuehong-privilege-assistant
        path: ${{ steps.find-apk.outputs.apk_path }}
        retention-days: 7
